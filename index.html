<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomorrowland Winter 2027</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#031a35;font-family:Arial,sans-serif}#site{border:0;width:100%;height:100%;display:block}.calcBtn{position:fixed;left:18px;bottom:20px;z-index:1001;border:0;border-radius:999px;background:#1689df;color:#fff;font-weight:700;font-size:16px;padding:14px 18px;box-shadow:0 8px 28px #0008;cursor:pointer}.shade{display:none;position:fixed;inset:0;z-index:1002;background:#000a;padding:18px;overflow:auto}.shade.open{display:flex;align-items:center;justify-content:center}.box{width:min(680px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#073b70,#04264b);color:#fff;border:1px solid #ffffff2c;border-radius:18px;padding:20px;box-shadow:0 18px 60px #000a}.head{display:flex;align-items:center;justify-content:space-between;gap:12px}.head h2{margin:0}.close{border:0;background:#ffffff18;color:#fff;font-size:25px;border-radius:9px;width:40px;height:40px}.rates,.entry{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}.entry{grid-template-columns:1.4fr 1fr .8fr auto}label{font-size:13px;color:#cfe8ff;display:block;margin-bottom:5px}input,select,button.add{width:100%;padding:11px;border-radius:9px;border:1px solid #ffffff35;background:#052f5d;color:#fff;font-size:15px}button.add{background:#1689df;border:0;font-weight:bold;cursor:pointer}.list{margin-top:16px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff20}.row small{color:#bcd7ef}.del{border:0;background:#ffffff16;color:#fff;border-radius:7px;padding:7px 9px}.totals{margin-top:18px;padding:15px;background:#ffffff10;border-radius:12px;font-size:18px;line-height:1.8}.empty{color:#bcd7ef;text-align:center;padding:18px}.clear{margin-top:12px;border:1px solid #ffffff35;background:transparent;color:#fff;padding:9px 13px;border-radius:8px}@media(max-width:600px){.calcBtn{left:12px;bottom:12px;font-size:14px;padding:12px 14px}.entry{grid-template-columns:1fr 1fr}.entry button{grid-column:1/-1}.box{padding:15px}.rates{grid-template-columns:1fr 1fr}}</style></head><body><iframe id="site" src="Tomorrowland-original-index.html" title="Tomorrowland Winter 2027"></iframe><button class="calcBtn" onclick="openCalc()">💰 מחשבון הוצאות</button><div class="shade" id="shade" onclick="if(event.target===this)closeCalc()"><div class="box"><div class="head"><h2>💰 מחשבון הוצאות לטיול</h2><button class="close" onclick="closeCalc()">×</button></div><div class="rates"><div><label>1 EUR = כמה ₪</label><input id="eurIls" type="number" step="0.01" value="3.85" oninput="saveRates();render()"></div><div><label>1 CHF = כמה ₪</label><input id="chfIls" type="number" step="0.01" value="4.10" oninput="saveRates();render()"></div></div><div class="entry"><div><label>קטגוריה</label><select id="cat"><option>✈️ טיסות</option><option>🛏️ לינה</option><option>🎟️ Tomorrowland</option><option>⛷️ סקי פס / ציוד</option><option>🚗 תחבורה</option><option>🍽️ אוכל</option><option>🛍️ קניות</option><option>➕ אחר</option></select></div><div><label>סכום</label><input id="amount" type="number" min="0" step="0.01" placeholder="0"></div><div><label>מטבע</label><select id="cur"><option>EUR</option><option>CHF</option><option>ILS</option></select></div><div style="align-self:end"><button class="add" onclick="addExpense()">הוסף</button></div></div><div class="list" id="list"></div><div class="totals" id="totals"></div><button class="clear" onclick="clearAll()">נקה את כל ההוצאות</button></div></div><script>const KEY='tlw27_expenses',RK='tlw27_rates';let expenses=JSON.parse(localStorage.getItem(KEY)||'[]');const fixedFlights=[{id:'flight-igor-2',cat:'✈️ טיסות — איגור + נוסע נוסף',amount:500,cur:'EUR'},{id:'flight-dina',cat:'✈️ טיסות — דינה',amount:250,cur:'EUR'}];fixedFlights.forEach(f=>{if(!expenses.some(x=>x.id===f.id))expenses.push(f)});localStorage.setItem(KEY,JSON.stringify(expenses));function openCalc(){document.getElementById('shade').classList.add('open');render()}function closeCalc(){document.getElementById('shade').classList.remove('open')}function loadRates(){try{let r=JSON.parse(localStorage.getItem(RK)||'{}');if(r.eur)eurIls.value=r.eur;if(r.chf)chfIls.value=r.chf}catch(e){}}function saveRates(){localStorage.setItem(RK,JSON.stringify({eur:+eurIls.value||0,chf:+chfIls.value||0}))}function addExpense(){let a=+amount.value;if(!a||a<0)return;expenses.push({cat:cat.value,amount:a,cur:cur.value});localStorage.setItem(KEY,JSON.stringify(expenses));amount.value='';render()}function removeExpense(i){expenses.splice(i,1);localStorage.setItem(KEY,JSON.stringify(expenses));render()}function clearAll(){if(confirm('למחוק את כל ההוצאות?')){expenses=[];localStorage.setItem(KEY,'[]');render()}}function ils(x){let e=+eurIls.value||0,c=+chfIls.value||0;return x.cur==='EUR'?x.amount*e:x.cur==='CHF'?x.amount*c:x.amount}function render(){let l=document.getElementById('list');if(!expenses.length)l.innerHTML='<div class="empty">עדיין לא נוספו הוצאות</div>';else l.innerHTML=expenses.map((x,i)=>'<div class="row"><div><b>'+x.cat+'</b><br><small>≈ ₪'+ils(x).toFixed(2)+'</small></div><div>'+x.amount.toFixed(2)+' '+x.cur+'</div><button class="del" onclick="removeExpense('+i+')">✕</button></div>').join('');let e=0,c=0,s=0;expenses.forEach(x=>{if(x.cur==='EUR')e+=x.amount;if(x.cur==='CHF')c+=x.amount;if(x.cur==='ILS')s+=x.amount});let total=expenses.reduce((a,x)=>a+ils(x),0);document.getElementById('totals').innerHTML='<b>סה״כ הוצאות</b><br>€ '+e.toFixed(2)+' &nbsp; | &nbsp; CHF '+c.toFixed(2)+' &nbsp; | &nbsp; ₪ '+s.toFixed(2)+'<br><b>סה״כ משוער בשקלים: ₪ '+total.toFixed(2)+'</b>'}loadRates();render();document.addEventListener('keydown',e=>{if(e.key==='Escape')closeCalc()});</script></body></html>
