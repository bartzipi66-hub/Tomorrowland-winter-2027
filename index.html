<!doctype html><html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tomorrowland Winter 2027</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#031a35;font-family:Arial,sans-serif}#site{border:0;width:100%;height:100%;display:block}.calcBtn{position:fixed;left:18px;bottom:20px;z-index:1001;border:0;border-radius:999px;background:#1689df;color:#fff;font-weight:700;font-size:16px;padding:14px 18px;box-shadow:0 8px 28px #0008}.shade{display:none;position:fixed;inset:0;z-index:1002;background:#000a;padding:18px;overflow:auto}.shade.open{display:flex;align-items:center;justify-content:center}.box{width:min(680px,100%);max-height:92vh;overflow:auto;background:linear-gradient(180deg,#073b70,#04264b);color:#fff;border-radius:18px;padding:20px}.head{display:flex;align-items:center;justify-content:space-between}.close,.del,.clear{border:1px solid #ffffff35;background:#ffffff12;color:#fff;border-radius:8px;padding:9px}.entry{display:grid;grid-template-columns:1.4fr 1fr .8fr auto;gap:10px;margin-top:16px}label{font-size:13px;color:#cfe8ff;display:block;margin-bottom:5px}input,select,.add{width:100%;padding:11px;border-radius:9px;border:1px solid #ffffff35;background:#052f5d;color:#fff;font-size:15px}.add{background:#1689df;border:0;font-weight:bold}.list{margin-top:16px}.row{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff20}.totals{margin-top:18px;padding:15px;background:#ffffff10;border-radius:12px;font-size:18px;line-height:1.8}.clear{margin-top:12px}@media(max-width:600px){.entry{grid-template-columns:1fr 1fr}.entry button{grid-column:1/-1}.box{padding:15px}}</style></head><body><iframe id="site" src="Tomorrowland-original-index.html" title="Tomorrowland Winter 2027"></iframe><button class="calcBtn" onclick="openCalc()">💰 מחשבון הוצאות</button><div class="shade" id="shade" onclick="if(event.target===this)closeCalc()"><div class="box"><div class="head"><h2>💰 מחשבון הוצאות לטיול</h2><button class="close" onclick="closeCalc()">×</button></div><div class="entry"><div><label>קטגוריה</label><select id="cat"><option>✈️ טיסות</option><option>🛏️ לינה</option><option>🎟️ Tomorrowland</option><option>⛷️ סקי פס / ציוד</option><option>🚗 תחבורה</option><option>🍽️ אוכל</option><option>🛍️ קניות</option><option>➕ אחר</option></select></div><div><label>סכום</label><input id="amount" type="number" min="0" step="0.01" placeholder="0"></div><div><label>מטבע</label><select id="cur"><option>EUR</option><option>CHF</option><option>ILS</option></select></div><div style="align-self:end"><button class="add" onclick="addExpense()">הוסף</button></div></div><div class="list" id="list"></div><div class="totals" id="totals"></div><button class="clear" onclick="clearAll()">נקה הוצאות נוספות</button></div></div><script>const KEY='tlw27_expenses_v2';let expenses=JSON.parse(localStorage.getItem(KEY)||'[]');const fixed=[{id:'flight-igor-2',cat:'✈️ טיסות — איגור + נוסע נוסף',amount:500,cur:'EUR'},{id:'flight-dina',cat:'✈️ טיסות — דינה',amount:250,cur:'EUR'}];function all(){return [...fixed,...expenses]}function openCalc(){shade.classList.add('open');render()}function closeCalc(){shade.classList.remove('open')}function addExpense(){let a=+amount.value;if(!a||a<0)return;expenses.push({cat:cat.value,amount:a,cur:cur.value});localStorage.setItem(KEY,JSON.stringify(expenses));amount.value='';render()}function removeExpense(i){expenses.splice(i,1);localStorage.setItem(KEY,JSON.stringify(expenses));render()}function clearAll(){if(confirm('למחוק את כל ההוצאות הנוספות?')){expenses=[];localStorage.setItem(KEY,'[]');render()}}function render(){let x=all();list.innerHTML=x.map((v,i)=>'<div class="row"><div><b>'+v.cat+'</b></div><div>'+v.amount.toFixed(2)+' '+v.cur+'</div>'+(i<fixed.length?'<span></span>':'<button class="del" onclick="removeExpense('+(i-fixed.length)+')">✕</button>')+'</div>').join('');let t={EUR:0,CHF:0,ILS:0};x.forEach(v=>t[v.cur]=(t[v.cur]||0)+v.amount);totals.innerHTML='<b>סה״כ הוצאות לפי מטבע</b><br>€ '+t.EUR.toFixed(2)+' &nbsp; | &nbsp; CHF '+t.CHF.toFixed(2)+' &nbsp; | &nbsp; ₪ '+t.ILS.toFixed(2)}render();site.addEventListener('load',()=>{try{let d=site.contentDocument,q=d.querySelectorAll('#flights .stay');if(q[0])q[0].innerHTML='<b>22.3.2027 — הלוך</b>EL AL LY345<br>TLV → GVA<br><strong>המראה 05:50 · נחיתה 08:50</strong>';if(q[1])q[1].innerHTML='<b>30.3.2027 — חזור</b>EL AL LY346<br>GVA → TLV<br><strong>המראה 11:00 · נחיתה 15:55</strong>'}catch(e){}});</script></body></html>
